<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        凌雲工務店｜大阪市の外壁塗装・屋根工事・リフォーム
    </title>

    <meta name="description"
          content="大阪市を中心に外壁塗装・屋根工事・防水工事・内装工事・店舗改修工事を承っております。無料点検・無料見積り受付中。">

    <meta name="keywords"
          content="大阪市,外壁塗装,屋根工事,防水工事,内装工事,リフォーム,凌雲工務店">

    <meta name="format-detection"
          content="telephone=no">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ======================================================
     ヘッダー
====================================================== -->

<header class="site-header">

    <div class="container">

        <a href="#" class="logo">

            <img
                src="logo.png"
                alt="凌雲工務店">

        </a>

    </div>

</header>

<!-- ======================================================
     メイン
====================================================== -->

<main>

<!-- ======================================================
     ヒーロー
====================================================== -->

<section
    id="hero"
    class="hero">

    <img
        src="hero.jpg"
        alt="凌雲工務店"
        class="hero-image">

    <!--
    hero.jpgの中の
    LINEボタン部分だけクリック
    -->

    <a
        href="https://lin.ee/Uky3OGy"
        target="_blank"
        rel="noopener noreferrer"
        class="hero-line"
        aria-label="LINEでお問い合わせ">
    </a>

</section>

<!-- ======================================================
     代表挨拶
====================================================== -->

<section
    id="message"
    class="image-section">

    <div class="container">

        <img
            src="ceo-message.jpg"
            alt="代表挨拶"
            class="full-image">

    </div>

</section>

<!-- ======================================================
     ドローン点検
====================================================== -->

<section
    id="drone"
    class="image-section">

    <div class="container">

        <img
            src="drone-inspection.jpg"
            alt="ドローン無料点検"
            class="full-image">

    </div>

</section>

<!-- ======================================================
     選ばれる理由
====================================================== -->

<section
    id="reason"
    class="image-section">

    <div class="container">

        <img
            src="reason.jpg"
            alt="選ばれる理由"
            class="full-image">

    </div>

</section>
<!-- ======================================================
     工事内容
====================================================== -->

<section
    id="service"
    class="image-section">

    <div class="container">

        <img
            src="service-list.jpg"
            alt="工事内容"
            class="full-image">

    </div>

</section>

<!-- ======================================================
     施工事例
====================================================== -->

<section
    id="works"
    class="works">

    <div class="container">

        <div class="section-title">

            <h2>施工事例</h2>

            <p>
                実際に施工させていただいた事例をご紹介します。
            </p>

        </div>

        <div class="works-grid">

            <!-- 施工事例 1 -->

            <article class="work-card">

                <div class="work-images">

                    <img
                        src="work01-before.jpg"
                        alt="施工前">

                    <img
                        src="work01-after.jpg"
                        alt="施工後">

                </div>

            </article>

            <!-- 施工事例 2 -->

            <article class="work-card">

                <div class="work-images">

                    <img
                        src="work02-before.jpg"
                        alt="施工前">

                    <img
                        src="work02-after.jpg"
                        alt="施工後">

                </div>

            </article>

            <!-- 施工事例 3 -->

            <article class="work-card">

                <div class="work-images">

                    <img
                        src="work03-before.jpg"
                        alt="施工前">

                    <img
                        src="work03-after.jpg"
                        alt="施工後">

                </div>

            </article>

        </div>

    </div>

</section>

<!-- ======================================================
     お問い合わせ
====================================================== -->

<section
    id="contact"
    class="contact">

    <div class="container">

        <div class="section-title">

            <h2>お問い合わせ</h2>

            <p>

                どんな小さなお悩みでもお気軽にご相談ください。

            </p>

        </div>

        <form
            class="contact-form">

            <div class="form-group">

                <input
                    type="text"
                    name="name"
                    placeholder="お名前"
                    required>

            </div>

            <div class="form-group">

                <input
                    type="tel"
                    name="tel"
                    placeholder="電話番号">

            </div>

            <div class="form-group">

                <input
                    type="email"
                    name="email"
                    placeholder="メールアドレス">

            </div>

            <div class="form-group">

                <textarea
                    name="message"
                    rows="6"
                    placeholder="お問い合わせ内容"></textarea>

            </div>

            <button
                type="submit"
                class="submit-btn">

                お問い合わせする

            </button>

        </form>

    </div>

</section>

</main>

<!-- ======================================================
     固定フッター
====================================================== -->

<div
    id="fixed-footer">

    <img
        src="footer.jpg"
        alt="お問い合わせ"
        class="footer-image">

    <!-- 左半分：電話 -->

    <a
        href="tel:0677772760"
        class="footer-phone"
        aria-label="電話する">
    </a>

    <!-- 右半分：LINE -->

    <a
        href="https://lin.ee/Uky3OGy"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-line"
        aria-label="LINEでお問い合わせ">
    </a>

</div>

<!-- ======================================================
     フッター
====================================================== -->

<footer
    class="site-footer">

    <div class="container">

        <p>

            © 2026 凌雲工務店 All Rights Reserved.

        </p>

    </div>

</footer>

<script src="script.js"></script>

</body>

</html>
